name: version-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read

jobs:
  version-gate:
    name: version-gate
    # labeled and unlabeled are here for one label only: no-bump changes this gate's
    # verdict, so adding or removing it has to re-run the gate. Every other label leaves
    # the verdict alone, and re-running for one costs more than nothing.
    #
    # It breaks the promotion. Adding promote-to-main would start a fresh version-gate run
    # on the same SHA, and .github/workflows/promote.yml needs this check already green
    # before it moves the ref. main's branch protection needs the same thing for the push
    # itself. A skipped job reports as passing, so this if: keeps the old green run
    # standing instead of putting a pending one beside it.
    if: >-
      github.event.action != 'labeled' && github.event.action != 'unlabeled'
      || github.event.label.name == 'no-bump'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # fetch-depth 0 on a pull request checks out the merge commit, which does
      # not give the branch ref a local name. Fetch it so origin/<base> resolves.
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Check the version bump
        env:
          NO_BUMP: ${{ contains(github.event.pull_request.labels.*.name, 'no-bump') && '1' || '0' }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/version-gate.sh "origin/${BASE_REF}" "${HEAD_SHA}"
