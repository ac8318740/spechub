# SpecHub terminal workspace.
# Copy to ~/.config/spechub/terminal-workspace.yaml, edit, then run setup.sh apply.
#
# This is machine-level, not per-project: it installs binaries and writes
# keybindings for your user, so it does not belong in spechub/project.yaml.

enabled: true

herdr:
  enabled: true
  # Direct chords that need no prefix. Use "alt" if you work over SSH:
  # many terminals cannot encode ctrl+alt through it. Set "none" to keep
  # herdr's default prefix-only keymap.
  chord_modifier: alt
  worktrees_directory: "~/.herdr/worktrees"
  # Agent state hook, so herdr reads state from the agent instead of the
  # screen. One of: claude, codex, opencode, copilot, none.
  integration: claude

delta:
  enabled: true
  # Sets core.pager and interactive.diffFilter. Agents are unaffected:
  # git only pages to a terminal.
  set_git_pager: true

diffnav:
  enabled: true
  # Popup that shows the most relevant diff: unstaged, else staged, else HEAD.
  popup_key: "alt+d"
  tab_key: "alt+shift+d"   # same tool, new tab instead of a popup

tuicr:
  enabled: true
  # Code review TUI. gh-dash hands pull requests to it; it is not the file
  # browser, which is yazi below.
  # Starting width of the file list, as a percentage of the content area.
  file_list_width: 30
  # Per-file +added -removed counts in the tree.
  show_file_line_stats: true
  #
  # TEMPORARY. Two upstream pull requests are still open:
  #   agavra/tuicr#607  configurable file line stats  (antonio2368)
  #   agavra/tuicr#633  <leader>L / <leader>H resize  (ours)
  # Until both merge, the two settings above only exist in a fork build.
  # `setup.sh status` checks both and tells you when to switch this off.
  # With it false, the stock release installs and those keys are ignored.
  build_from_fork: false
  fork: "https://github.com/ac8318740/tuicr"
  fork_branch: "local/daily"

yazi:
  enabled: true
  # File manager. Markdown renders live in the preview pane through
  # spechub-md, so a document draws as the cursor moves over it, and Enter
  # opens the same renderer full width where more of a diagram fits.
  popup_key: "alt+y"          # floating, does not change the tab layout
  tab_key: "alt+shift+y"      # opens a real tab instead
  show_hidden: true

markdown:
  enabled: true
  # spechub-md reads a markdown file with its mermaid diagrams drawn as text,
  # and can serve the same file to a real browser for the ones worth studying.
  #
  # Text rather than inline images is deliberate. herdr emits the kitty
  # graphics protocol, and no terminal reachable over SSH from Windows or
  # Android renders it, so an image never arrives. e-ink panels also render
  # text far better than bitmaps: the fast refresh modes an interactive
  # terminal needs are the ones that drop the greyscale depth an image needs.
  preview_port: 6419

gh_dash:
  enabled: true
  popup_key: "alt+i"
  tab_key: "alt+shift+i"
  # Add a section for whichever repo you are standing in, at launch.
  dynamic_repo_section: true
  sections:
    - title: Mine
      filters: "is:open author:@me"
    - title: Needs review
      filters: "is:open review-requested:@me"
    - title: Failing
      filters: "is:open author:@me status:failure"
  # Local clones. Needed for checkout and for {{.RepoPath}} in keybindings.
  repo_paths: {}
  # Bind PageUp and PageDown to scroll the preview. gh-dash uses ctrl+u and
  # ctrl+d by default, which is fine in vim and awkward everywhere else.
  page_keys: true
  keybindings:
    # Pipe the selected pull request into diffnav.
    tree_diff: "D"
    # Hand the selected pull request to an agent. Empty disables it.
    agent_review: "S"
